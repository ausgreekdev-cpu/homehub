[build]
  base = "apps/web"
  command = "cd ../.. && pnpm install && node scripts/check-env.mjs && pnpm --filter @homehub/web build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  # The Supabase URL is public by design (inlined into client bundles as
  # NEXT_PUBLIC_SUPABASE_URL). Tell Netlify's secrets scanner not to treat
  # these keys as leaked secrets.
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL,NEXT_PUBLIC_SUPABASE_URL"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-DNS-Prefetch-Control = "on"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"
